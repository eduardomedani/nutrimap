<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriMap — Aluno</title>
<meta name="theme-color" content="#2A3A2C">
<meta name="description" content="Seu treino e sua progressão de carga — NutriMap">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriMap">

<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  // Re-renderiza os ícones Lucide sempre que o DOM muda (conteúdo dinâmico).
  //
  // createIcons() troca o nó do ícone e deixa o data-lucide no <svg> que criou,
  // então ele se reprocessa sem parar — e cada troca é uma mutação que
  // reagenda o próprio observer. Um <svg> novo por frame quebra o clique: se o
  // nó muda entre mousedown e mouseup, o browser não dispara "click".
  // Desconectar durante a escrita + tirar o atributo encerra o ciclo.
  let _iconRaf = null;
  const _iconObs = new MutationObserver(renderIcons);
  function observarIcones() {
    _iconObs.observe(document.documentElement, { childList: true, subtree: true });
  }
  function renderIcons() {
    if (!window.lucide) return;
    if (_iconRaf) return;
    _iconRaf = requestAnimationFrame(() => {
      _iconRaf = null;
      _iconObs.disconnect();
      try {
        window.lucide.createIcons();
        document.querySelectorAll('svg[data-lucide]').forEach(el => el.removeAttribute('data-lucide'));
      } catch (e) {}
      observarIcones();
    });
  }
  document.addEventListener('DOMContentLoaded', renderIcons);
  observarIcones();
</script>

<style>
  :root {
    --bg: #F7F6F2; --bg-card: #FFFFFF; --bg-warm: #EDE7D8;
    --ink: #1A1F1B; --ink-soft: #4A524C; --ink-mute: #8A8F89;
    --moss: #3D4D3F; --moss-deep: #2A3A2C; --moss-light: #5C6E5E;
    --olive: #5C6B47; --sage: #87A082; --gold: #B8924A;
    --plum: #7D6A86; --plum-soft: rgba(125,106,134,0.12); --plum-line: rgba(125,106,134,0.28);
    --danger: #B4553F;
    --cream: #F8F1DD; --line: #E8E8E8; --hair: rgba(26,31,27,0.07);
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.05);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 8%, rgba(135,160,130,0.10), transparent 42%),
                      radial-gradient(circle at 85% 92%, rgba(184,146,74,0.07), transparent 45%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Nunito', sans-serif; font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  em { font-style: italic; }
  a { color: inherit; }
  input, select, button { font-family: inherit; }
  /* Ícones minimalistas: traço mais fino em todo o app do aluno. */
  svg.lucide { stroke-width: 1.6; }

  /* ── Boot / carregando ── */
  .pa-boot { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--ink-soft); padding: 24px; }
  .pa-boot svg { width: 34px; height: 34px; color: var(--gold); }
  .pa-spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--line); border-top-color: var(--moss); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
  .pa-spin-lg { width: 30px; height: 30px; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ── Auth / vincular ── */
  .pa-auth { max-width: 420px; margin: 0 auto; padding: 40px 20px 32px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .pa-brand { text-align: center; margin-bottom: 22px; }
  .pa-brand-mark { width: 56px; height: 56px; margin: 0 auto 12px; background: linear-gradient(135deg, var(--moss), var(--olive)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--cream); font-size: 26px; font-weight: 600; font-style: italic; box-shadow: var(--shadow); }
  .pa-brand-name { font-size: 28px; font-weight: 500; }
  .pa-brand-name em { color: var(--moss); }
  .pa-brand-sub { color: var(--moss); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-top: 4px; }

  .pa-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
  .pa-tabs { display: flex; gap: 6px; background: var(--bg-warm); border-radius: 100px; padding: 4px; margin-bottom: 18px; }
  .pa-tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 100px; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: all 0.2s; }
  .pa-tab.active { background: var(--moss); color: var(--cream); }

  .pa-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 6px; }
  .pa-input { width: 100%; padding: 13px 15px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; color: var(--ink); transition: border-color 0.2s; }
  .pa-input:focus { outline: none; border-color: var(--moss); }
  .pa-codigo { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; text-align: center; font-size: 20px; }

  .pa-btn { width: 100%; margin-top: 20px; padding: 14px; background: var(--moss); color: var(--cream); border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .pa-btn:hover:not(:disabled) { background: var(--moss-deep); transform: translateY(-1px); }
  .pa-btn:disabled { opacity: 0.6; cursor: default; }
  .pa-btn svg { width: 17px; height: 17px; }

  .pa-msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: #b4553f; text-align: center; }
  .pa-msg.ok { color: var(--moss); }
  .pa-hint { font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; line-height: 1.5; }
  .pa-foot { text-align: center; font-size: 12.5px; color: var(--ink-mute); margin-top: 20px; line-height: 1.5; }
  .pa-link { display: block; width: 100%; margin-top: 14px; background: none; border: none; color: var(--ink-mute); font-size: 13px; cursor: pointer; text-decoration: underline; }

  /* ── Topbar ── */
  .pa-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 18px 12px; background: rgba(253,251,247,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .pa-topbrand { font-size: 19px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .pa-topbrand em { color: var(--moss); }
  .pa-topmark { width: 30px; height: 30px; background: linear-gradient(135deg, var(--moss), var(--olive)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--cream); font-size: 15px; font-weight: 600; font-style: italic; }
  .pa-topuser { display: flex; align-items: center; gap: 8px; }
  .pa-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--sage), var(--moss-light)); color: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .pa-username { font-size: 14px; font-weight: 600; }
  .pa-logout { background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 6px; display: flex; border-radius: 8px; }
  .pa-logout:hover { background: var(--bg-warm); color: var(--ink); }
  .pa-logout svg { width: 19px; height: 19px; }

  /* ── Treino ── */
  .pa-main { max-width: 620px; margin: 0 auto; padding: 18px 16px 96px; }

  /* Navegação inferior (Treino | Dieta) */
  .pa-bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: rgba(253,251,247,0.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .pa-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 8px; background: none; border: none; cursor: pointer; color: var(--ink-mute); font-size: 11px; font-weight: 700; font-family: inherit; transition: color 0.15s; }
  .pa-nav-item svg { width: 21px; height: 21px; }
  .pa-nav-item.active { color: var(--moss); }
  .pa-select { padding: 9px 12px; border: 1px solid var(--hair); border-radius: 10px; background: var(--bg-card); font-size: 13.5px; color: var(--ink); max-width: 100%; }

  /* ── Hero: tela inicial do treino do dia ── */
  .pa-hero { background: linear-gradient(150deg, var(--bg-card) 0%, #EEF2EB 100%); border-radius: 20px; padding: 20px 20px 17px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .pa-hero-hi { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .pa-hero-title { font-size: 27px; font-weight: 800; color: var(--moss-deep); line-height: 1.08; letter-spacing: -0.015em; margin-top: 2px; }
  .pa-hero-sel { margin-top: 11px; }
  .pa-hero-bar { margin-top: 17px; height: 7px; border-radius: 100px; background: #E4E7E0; overflow: hidden; }
  .pa-hero-bar > span { display: block; height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--moss), var(--sage)); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .pa-hero-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .pa-hero-count b { color: var(--moss-deep); font-weight: 800; }
  .pa-hero-time { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-mute); }
  .pa-hero-time svg { width: 14px; height: 14px; }

  /* ── Indicadores de evolução (topo): sequência + recordes ── */
  .pa-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .pa-stat { background: var(--bg-card); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 15px; box-shadow: var(--shadow); }
  .pa-stat-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-mute); }
  .pa-stat-ic { font-size: 15px; line-height: 1; }
  .pa-stat-val { margin-top: 7px; font-size: 23px; font-weight: 800; color: var(--moss-deep); line-height: 1; letter-spacing: -0.01em; }
  .pa-stat-val small { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-left: 3px; }

  /* ── Tela de seleção de dia (lista) ── */
  .pa-hero-sub { margin-top: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .pa-hero-sub b { color: var(--moss-deep); font-weight: 800; }
  .pa-lista-sel { margin-bottom: 14px; }
  .pa-diacards { display: flex; flex-direction: column; gap: 11px; }
  .pa-diacard { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: var(--bg-card); border: 1px solid var(--hair); border-radius: 16px; padding: 13px 14px; box-shadow: var(--shadow); cursor: pointer; font-family: inherit; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; }
  .pa-diacard:hover { transform: translateY(-1px); }
  .pa-diacard.prox { border-color: var(--sage); background: linear-gradient(150deg, var(--bg-card) 0%, #EEF3EC 100%); }

  /* Card em destaque: o treino "PRÓXIMO" — principal ação da tela */
  .pa-diacard.featured { display: block; padding: 16px 16px 15px; cursor: default; border: 1.5px solid var(--sage); background: linear-gradient(155deg, #FCFEFB 0%, #E9F1E6 100%); box-shadow: 0 2px 4px rgba(60,77,63,0.05), 0 12px 26px rgba(60,77,63,0.11); }
  .pa-diacard.featured:hover { transform: none; }
  .pa-dc-head { display: flex; align-items: center; gap: 13px; }
  .pa-dc-headtext { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .pa-diacard.featured .pa-dc-nome { font-size: 18px; }
  .pa-dc-info { margin-top: 14px; }
  .pa-dc-grupos { font-size: 13px; font-weight: 700; color: var(--moss-deep); line-height: 1.35; }
  .pa-dc-conta { margin-top: 3px; font-size: 12.5px; font-weight: 600; color: var(--ink-mute); }
  .pa-dc-cta { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 13px; background: var(--moss); color: var(--cream); font-family: inherit; font-size: 14.5px; font-weight: 800; cursor: pointer; transition: background 0.2s, transform 0.15s; }
  .pa-dc-cta:hover { background: var(--moss-deep); transform: translateY(-1px); }
  .pa-dc-cta svg { width: 17px; height: 17px; }

  .pa-dc-letra { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; background: var(--cream); color: var(--moss-deep); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
  .pa-diacard.prox .pa-dc-letra { background: var(--moss); color: var(--cream); }
  .pa-dc-body { flex: 1 1 auto; min-width: 0; }
  .pa-dc-top { display: flex; align-items: center; gap: 8px; }
  .pa-dc-nome { font-size: 16px; font-weight: 800; color: var(--ink); }
  .pa-dc-sub { display: block; margin-top: 3px; font-size: 12.5px; font-weight: 600; color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-dc-badge { flex: 0 0 auto; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .pa-dc-badge.prox { background: var(--moss); color: var(--cream); }
  .pa-dc-badge.feito { background: rgba(135,160,130,0.18); color: var(--moss-deep); }
  .pa-dc-arrow { flex: 0 0 auto; color: var(--ink-mute); display: flex; }
  .pa-dc-arrow svg { width: 20px; height: 20px; }

  /* ── Página do treino: voltar + finalizar ── */
  .pa-back { display: inline-flex; align-items: center; gap: 3px; background: none; border: none; color: var(--ink-mute); font-size: 13.5px; font-weight: 700; font-family: inherit; cursor: pointer; padding: 4px 8px 4px 2px; margin-bottom: 10px; border-radius: 8px; }
  .pa-back svg { width: 18px; height: 18px; }
  .pa-back:hover { color: var(--moss); }
  .pa-finalizar { margin-top: 18px; }

  .pa-dias { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
  .pa-dia { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--hair); background: var(--bg-card); color: var(--ink-soft); font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.18s; }
  .pa-dia.active { background: var(--moss); color: var(--cream); border-color: var(--moss); box-shadow: var(--shadow); }

  /* ── Card de exercício ── */
  .pa-ex { background: var(--bg-card); border: 1px solid var(--hair); border-radius: var(--radius); padding: 16px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }

  /* 1 · Cabeçalho */
  .pa-ex-top { display: flex; align-items: flex-start; gap: 12px; }
  .pa-ex-num { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--cream); color: var(--moss-deep); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
  .pa-ex-nome { font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.18; letter-spacing: -0.01em; }
  .pa-ex-grupo { font-size: 11px; color: var(--moss); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-top: 3px; }

  /* 2 · Linha compacta de prescrição */
  .pa-ex-spec { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; margin-top: 13px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }
  .pa-ex-spec b { color: var(--ink); font-weight: 800; }
  .pa-ex-spec .sep { color: #CBCBC7; }
  .pa-ex-tec { display: inline-flex; align-items: center; gap: 4px; background: rgba(184,146,74,0.13); color: #927023; padding: 2px 9px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-ex-tec svg { width: 12px; height: 12px; }

  .pa-metodo { margin-top: 12px; background: rgba(184,146,74,0.08); border-left: 2px solid var(--gold-soft, var(--gold)); border-radius: 8px; padding: 9px 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
  .pa-metodo svg { width: 13px; height: 13px; color: var(--gold); vertical-align: -2px; }
  .pa-obs { margin-top: 11px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; }
  .pa-obs svg { width: 13px; height: 13px; color: var(--ink-mute); vertical-align: -2px; }
  .pa-obs-tec { color: var(--ink-mute); }

  /* 3-4 · Último treino + evolução (painel sem contorno, só um leve tom verde) */
  .pa-ex-last { margin-top: 15px; background: rgba(60,77,63,0.05); border-radius: 14px; padding: 11px 13px; }
  .pa-last-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pa-last-lab { font-size: 10px; font-weight: 800; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.07em; }
  .pa-last-val { margin-top: 5px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }
  .pa-last-val b { color: var(--moss-deep); font-weight: 800; }
  .pa-last-date { color: var(--ink-mute); font-weight: 600; }
  .pa-last-vazio { margin-top: 4px; font-size: 12.5px; color: var(--ink-mute); font-weight: 600; font-style: italic; }
  .pa-evo { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .pa-evo svg { width: 14px; height: 14px; }
  .pa-evo.up { color: var(--moss); }
  .pa-evo.flat, .pa-evo.down { color: var(--ink-mute); }

  /* 5 · Rodapé / ação principal */
  .pa-ex-foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .pa-video { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--moss); text-decoration: none; padding: 8px 12px; border-radius: 10px; background: var(--bg-warm); }
  .pa-video svg { width: 15px; height: 15px; }
  .pa-carga-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border: none; border-radius: 12px; background: var(--moss); color: var(--cream); font-size: 13.5px; font-weight: 800; cursor: pointer; transition: background 0.2s, transform 0.15s; }
  .pa-carga-btn:hover { background: var(--moss-deep); transform: translateY(-1px); }
  .pa-carga-btn svg { width: 16px; height: 16px; }
  /* Exercício concluído hoje — botão dourado */
  .pa-carga-btn.pa-carga-btn-done { background: var(--gold); color: #fff; box-shadow: 0 2px 10px rgba(184,146,74,0.30); }
  .pa-carga-btn.pa-carga-btn-done:hover { background: #a67f38; }

  /* ── Progressão ── */
  .pa-prog { margin-top: 16px; border-top: 1px solid var(--hair); padding-top: 16px; }
  .pa-prog-head { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--moss-deep); margin-bottom: 10px; }
  .pa-prog-head svg { width: 16px; height: 16px; color: var(--moss); }
  .pa-prog-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pa-mini { padding: 10px 12px; font-size: 16px; }   /* 16px evita zoom automático no iOS */
  .pa-prog-form [data-p="obs"] { grid-column: 1 / -1; }
  .pa-btn-mini { grid-column: 1 / -1; margin-top: 2px; padding: 11px; font-size: 14px; }

  .pa-prog-list { display: flex; flex-direction: column; gap: 6px; }
  .pa-prog-row { display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 9px; padding: 8px 10px; font-size: 13px; }
  .pa-prog-data { color: var(--ink-mute); font-weight: 600; }
  .pa-prog-carga { color: var(--moss-deep); font-weight: 700; }
  .pa-prog-reps { color: var(--ink-soft); }
  .pa-prog-obs { color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-prog-del { background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 3px; display: flex; }
  .pa-prog-del:hover { color: #b4553f; }
  .pa-prog-del svg { width: 15px; height: 15px; }
  .pa-prog-vazio { font-size: 13px; color: var(--ink-mute); text-align: center; padding: 6px 0 2px; }

  /* Registro por série (peso + reps de cada série) */
  .pa-prog-when { font-size: 11.5px; font-weight: 600; color: var(--ink-mute); margin-left: auto; }
  .pa-series { display: flex; flex-direction: column; gap: 11px; margin-bottom: 12px; }
  .pa-serie { display: grid; grid-template-columns: 32px 1fr 1fr 40px; gap: 10px; align-items: center; }
  .pa-serie-num { font-size: 14px; font-weight: 800; color: var(--moss); text-align: center; }
  .pa-serie-lab { padding-bottom: 0; }
  .pa-serie-lab span { font-size: 11px; font-weight: 600; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-serie .pa-mini { text-align: center; }
  /* Botão de concluir cada série — círculo discreto; estado concluído preenchido */
  .pa-serie-check { justify-self: end; width: 36px; height: 36px; padding: 0; border: 1px solid var(--hair); border-radius: 50%; background: var(--bg); color: var(--ink-mute); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
  .pa-serie-check svg { width: 17px; height: 17px; }
  .pa-serie-check:hover { border-color: var(--sage); color: var(--moss); }
  .pa-serie.done .pa-serie-check { background: var(--moss); border-color: var(--moss); color: var(--cream); }
  .pa-serie.done .pa-serie-num { color: var(--sage); }
  .pa-serie.done .pa-mini { border-color: transparent; background: rgba(135,160,130,0.12); color: var(--moss-deep); font-weight: 700; }
  .pa-series-prog { font-size: 12px; font-weight: 700; color: var(--ink-mute); margin: 2px 0 12px 2px; }
  .pa-series-prog b { color: var(--moss); }
  .pa-btn-mini.pa-btn-ready { box-shadow: 0 0 0 3px rgba(135,160,130,0.25); }

  /* ── Drop set — sub-série vinculada à série principal ── */
  .pa-serie-block { display: flex; flex-direction: column; }
  /* Selo discreto "DROP SET" sob a linha da série */
  .pa-drop-badge { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
    margin: 7px 0 0 42px; padding: 3px 9px; border-radius: 7px;
    background: var(--plum-soft); color: var(--plum);
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
  .pa-drop-badge svg { width: 13px; height: 13px; }
  .pa-serie-block.drop-done .pa-drop-badge,
  .pa-serie-block.drop-done .pa-serie { display: none; }

  /* Painel do drop — expande/recolhe suave via grid-template-rows */
  .pa-drop-wrap { display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows 0.22s ease, opacity 0.22s ease; }
  .pa-serie-block.drop-open .pa-drop-wrap { grid-template-rows: 1fr; opacity: 1; }
  .pa-drop-inner { overflow: hidden; }
  .pa-drop { margin: 10px 0 2px 20px; padding: 12px 14px; border-left: 2px solid var(--plum-line);
    background: var(--plum-soft); border-radius: 0 12px 12px 0; }
  .pa-drop-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800;
    color: var(--plum); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 11px; }
  .pa-drop-head svg { width: 15px; height: 15px; }
  .pa-drop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pa-drop-field { display: flex; flex-direction: column; gap: 5px; }
  .pa-drop-lab { font-size: 11px; font-weight: 700; color: var(--ink-soft); display: flex; gap: 5px; align-items: baseline; }
  .pa-drop-alvo { font-weight: 700; color: var(--plum); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-drop-hint { font-size: 10.5px; color: var(--ink-mute); }
  .pa-btn-drop { margin-top: 12px; width: 100%; display: inline-flex; align-items: center; justify-content: center;
    gap: 7px; padding: 11px; min-height: 44px; border: none; border-radius: 11px;
    background: var(--plum); color: #fff; font-size: 13.5px; font-weight: 800; cursor: pointer;
    transition: background 0.15s, transform 0.1s; }
  .pa-btn-drop svg { width: 16px; height: 16px; }
  .pa-btn-drop:hover { background: #6b5975; }
  .pa-btn-drop:active { transform: translateY(1px); }

  /* Resumo compacto quando a série (principal + drop) está concluída */
  .pa-serie-resumo { display: none; width: 100%; align-items: center; gap: 9px; text-align: left;
    padding: 9px 11px; border: 1px solid var(--hair); border-radius: 11px; background: var(--bg);
    cursor: pointer; font: inherit; min-height: 44px; }
  .pa-serie-block.drop-done .pa-serie-resumo { display: flex; }
  .pa-res-check { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: var(--gold); color: #fff; align-items: center; justify-content: center; }
  .pa-res-check svg { width: 14px; height: 14px; }
  .pa-res-main { font-size: 13px; color: var(--moss-deep); font-weight: 700; }
  .pa-res-drop { display: inline-flex; align-items: center; gap: 4px; margin-left: auto;
    font-size: 12px; font-weight: 700; color: var(--plum); white-space: nowrap; }
  .pa-res-drop svg { width: 13px; height: 13px; }

  /* Validação inline (sem alert do navegador) */
  .pa-field-err { color: var(--danger); font-size: 11.5px; font-weight: 700; margin-top: 7px; }
  .pa-field-err:empty { display: none; }
  .pa-input-err { border-color: #D98A76 !important; box-shadow: 0 0 0 2px rgba(180,85,63,0.15); }

  @media (prefers-reduced-motion: reduce) {
    .pa-drop-wrap { transition: none; }
  }

  /* ── Bi-set (grupo A + B) no app do aluno ── */
  .pa-biset { border: 1.5px solid var(--sage); border-radius: var(--radius); background: rgba(135,160,130,0.06); padding: 12px; margin-bottom: 14px; }
  .pa-biset-head { display: flex; align-items: center; gap: 9px; margin: 2px 4px 10px; }
  .pa-biset-selo { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; background: rgba(60,77,63,0.10); color: var(--moss-deep); font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .pa-biset-selo svg { width: 14px; height: 14px; }
  .pa-biset-n { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--ink-mute); }
  .pa-biset .pa-ex { box-shadow: none; border: 1px solid var(--hair); margin-bottom: 0; }
  .pa-biset .pa-ex .pa-ex-num { background: linear-gradient(135deg, var(--sage), var(--moss-light)); color: var(--cream); }
  .pa-biset-conector { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 9px 0; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--olive); }
  .pa-biset-conector svg { width: 14px; height: 14px; }
  .pa-biset-descanso { display: flex; align-items: center; gap: 7px; margin-top: 11px; padding: 10px 13px; border-radius: 12px; background: var(--bg-warm); font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .pa-biset-descanso b { color: var(--moss-deep); font-weight: 800; }
  .pa-biset-descanso svg { width: 15px; height: 15px; color: var(--moss); }
  .pa-biset-incompleto { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: rgba(184,146,74,0.10); color: #8a6d1e; font-size: 12.5px; font-weight: 600; }
  .pa-biset-incompleto svg { width: 15px; height: 15px; flex: none; }

  /* ── Lembrete "Treino atualizado" ── */
  .pa-lembrete { display: flex; align-items: center; gap: 11px; margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: rgba(184,146,74,0.12); border: 1px solid rgba(184,146,74,0.30); }
  .pa-lembrete > svg { width: 20px; height: 20px; color: var(--gold); flex: none; }
  .pa-lembrete-txt { display: flex; flex-direction: column; line-height: 1.3; }
  .pa-lembrete-txt b { font-size: 13.5px; color: var(--ink); font-weight: 800; }
  .pa-lembrete-txt span { font-size: 12px; color: var(--ink-soft); }
  .pa-lembrete-x { margin-left: auto; background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 6px; display: flex; flex: none; border-radius: 8px; }
  .pa-lembrete-x:hover { background: rgba(0,0,0,0.05); }
  .pa-lembrete-x svg { width: 16px; height: 16px; }
  .pa-hist-head { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 8px; }
  .pa-hist-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 9px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
  .pa-hist-data { color: var(--ink-mute); font-weight: 600; }
  .pa-hist-sets { color: var(--moss-deep); font-weight: 600; }

  .pa-chart { margin-bottom: 12px; }
  .pa-spark { width: 100%; height: 60px; }
  .pa-spark polyline { fill: none; stroke: var(--moss); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pa-spark circle { fill: var(--gold); }
  .pa-trend { font-size: 11.5px; color: var(--ink-mute); text-align: center; margin-top: 4px; font-weight: 600; }
  .pa-loading { font-size: 13px; color: var(--ink-mute); display: flex; align-items: center; gap: 8px; }

  /* ── Vazios ── */
  .pa-empty { text-align: center; color: var(--ink-mute); padding: 26px 16px; font-size: 14px; }
  .pa-empty svg { width: 22px; height: 22px; vertical-align: -4px; margin-right: 4px; }
  .pa-empty-lg { padding: 60px 20px; }
  .pa-empty-lg svg { display: block; width: 40px; height: 40px; margin: 0 auto 14px; color: var(--sage); }
  .pa-empty-t { font-size: 18px; font-weight: 600; color: var(--ink-soft); }
  .pa-empty-s { font-size: 14px; margin-top: 6px; max-width: 320px; margin-inline: auto; line-height: 1.5; }

  @media (min-width: 520px) {
    .pa-prog-form { grid-template-columns: 1fr 1fr 1fr; }
    .pa-prog-form [data-p="obs"] { grid-column: 1 / -1; }
  }
</style>
</head>
