<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- `interactive-widget=resizes-content`: o teclado virtual passa a ENCOLHER a
     viewport de layout em vez de deslizar por cima dela. Sem isso, a barra
     inferior fica presa atrás do teclado. Cobre Android e iOS 17+; nas versões
     anteriores quem resolve é o sincronismo de visualViewport, mais abaixo. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Evollo — Aluno</title>
<meta name="theme-color" content="#18B984">
<meta name="description" content="Seu treino e sua progressão de carga — Evollo">
<meta name="application-name" content="Evollo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evollo">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  // Re-renderiza os ícones Lucide sempre que o DOM muda (conteúdo dinâmico).
  //
  // createIcons() troca o nó do ícone e deixa o data-lucide no <svg> que criou,
  // então ele se reprocessa sem parar — e cada troca é uma mutação que
  // reagenda o próprio observer. Um <svg> novo por frame quebra o clique: se o
  // nó muda entre mousedown e mouseup, o browser não dispara "click".
  // Desconectar durante a escrita + tirar o atributo encerra o ciclo.
  let _iconRaf = null;
  const _iconObs = new MutationObserver(renderIcons);
  function observarIcones() {
    _iconObs.observe(document.documentElement, { childList: true, subtree: true });
  }
  function renderIcons() {
    if (!window.lucide) return;
    if (_iconRaf) return;
    _iconRaf = requestAnimationFrame(() => {
      _iconRaf = null;
      _iconObs.disconnect();
      try {
        window.lucide.createIcons();
        document.querySelectorAll('svg[data-lucide]').forEach(el => el.removeAttribute('data-lucide'));
      } catch (e) {}
      observarIcones();
    });
  }
  document.addEventListener('DOMContentLoaded', renderIcons);
  observarIcones();
</script>

<script>
  // ── A casca contra a viewport que o iOS erra ──────────────────────────
  // Só apresentação: escreve duas variáveis CSS. Não conhece treino, dieta,
  // rota nem dado nenhum.
  //
  // `#app.pa-shell` é `position: fixed; inset: 0`, que ancora na viewport de
  // LAYOUT. Existem DOIS jeitos de essa viewport discordar da tela, e eles vão
  // em direções opostas — foi cair só no segundo que deixou a primeira versão
  // deste bloco sem efeito no aparelho:
  //
  //   1. LANÇAMENTO DO PWA no iPhone: a viewport de layout vem MENOR que a
  //      tela. A visual é a certa, e é a MAIOR das duas. `inset: 0` herda a
  //      medida curta, a casca termina antes do fim da tela e aparece uma
  //      faixa do fundo embaixo da barra.
  //   2. TECLADO ABERTO: o iOS encolhe a viewport VISUAL e deixa a de layout
  //      do tamanho da tela, ainda deslocando uma contra a outra. Agora a
  //      visual é a MENOR. Sem ajuste, a barra fica atrás do teclado.
  //
  // A primeira versão testava só `innerHeight - vv.height > 1`, que é o caso 2.
  // No caso 1 essa conta dá negativo, nada era escrito, e a casca ficava com a
  // viewport errada — que é o defeito que se queria corrigir.
  //
  // A regra certa não tem direção: a visualViewport é a única fonte que sabe o
  // que está REALMENTE visível, então a casca ESPELHA ela sempre que as duas
  // discordam, para qualquer lado. Quando concordam, nenhuma variável existe e
  // o `inset: 0` responde sozinho.
  (function ancorarCasca() {
    const vv = window.visualViewport;
    if (!vv) return;              // sem suporte, o inset: 0 já basta
    const raiz = document.documentElement;
    let agendado = null;

    // NÃO tente esticar a casca até `screen` em standalone. Foi tentado, com
    // as guardas certas, e o aparelho recusou — medido no iPhone:
    //
    //   tela 956 · viewport de layout 894 · insets topo 62px
    //   (956 − 894 = 62 = exatamente o recuo do topo)
    //
    // O iOS reserva o recuo do topo, desenha o conteúdo a partir de y=0 mesmo
    // assim, e os 62px sobram no fim. A regra media certo — a casca ia a 956,
    // `barra fim 956`, `sobra real 0` — mas o iOS ACEITA a geometria e não
    // PINTA o que passa da viewport de layout: os ícones saíam cortados ao meio
    // em 894 e os rótulos, inteiramente abaixo, sumiam.
    //
    // Ou seja: aqueles 62px não são endereçáveis por layout. O que pinta ali é
    // só o fundo do canvas (html/body), que é como a faixa aparece.
    //
    // A decisão, isolada e síncrona. Exposta para o teste poder exercitá-la sem
    // depender de quadro — `requestAnimationFrame` não roda com a aba oculta.
    function aplicar() {
      // 1px de tolerância: a visualViewport devolve fracionário e ficaria
      // reescrevendo a variável a cada quadro durante a rolagem.
      const discorda = Math.abs(vv.height - window.innerHeight) > 1 || vv.offsetTop > 1;
      if (discorda) {
        raiz.style.setProperty('--pa-casca-h', vv.height + 'px');
        raiz.style.setProperty('--pa-casca-top', vv.offsetTop + 'px');
      } else {
        raiz.style.removeProperty('--pa-casca-h');
        raiz.style.removeProperty('--pa-casca-top');
      }
    }
    window.__ancorarCascaAplicar = aplicar;

    function sincronizar() {
      // Reagenda em vez de ignorar: um pedido pendente que nunca virou quadro
      // (aba oculta, app em segundo plano) não pode engolir os pedidos
      // seguintes. Um ajuste por quadro, e o último pedido é o que vale.
      if (agendado) cancelAnimationFrame(agendado);
      agendado = requestAnimationFrame(() => { agendado = null; aplicar(); });
    }

    vv.addEventListener('resize', sincronizar);
    vv.addEventListener('scroll', sincronizar);
    // O iOS ressincroniza a viewport sozinho depois do lançamento — era o que
    // o toque duplo forçava, no defeito antigo. Nem toda ressincronização
    // dispara evento de visualViewport, então remedimos também nestes marcos.
    // Não são "alturas mágicas": nenhum número de tela aparece aqui, é só
    // quando perguntar de novo.
    addEventListener('resize', sincronizar);
    addEventListener('orientationchange', sincronizar);
    addEventListener('pageshow', sincronizar);
    addEventListener('load', sincronizar);
    document.addEventListener('visibilitychange', sincronizar);
    // A PRIMEIRA medida é síncrona, sem esperar quadro: no lançamento do PWA a
    // casca precisa nascer ancorada, e um app que abre em segundo plano pode
    // levar segundos até o primeiro frame. As seguintes podem esperar.
    aplicar();
  })();

  // ── Diagnóstico de viewport e da barra inferior ───────────────────────
  // Liga por `?diag=1` OU por CINCO TOQUES no logo. O toque existe porque o
  // app instalado não tem barra de endereço: dentro dele não há como chegar a
  // uma URL com parâmetro, e é justamente lá que o defeito aparece.
  //
  // A primeira versão deste gesto NÃO funcionava no iPhone, por três motivos —
  // vale escrito, porque os três são armadilhas de toque no iOS:
  //
  //   1. escutava `click`. Toques rápidos e repetidos num elemento que não é
  //      botão fazem o Safari tentar o double-tap-to-zoom e a seleção de texto,
  //      e os `click` seguintes são atrasados ou engolidos — cinco nunca
  //      chegavam. `pointerup` é entregue antes de qualquer uma dessas
  //      interpretações e não depende de o gesto virar clique.
  //   2. o logo tem texto ("Evollo") e nada que impedisse seleção: o segundo
  //      toque já começava a selecionar a palavra, e daí o iOS tratava o gesto
  //      como seleção. Resolvido no CSS de .pa-topbrand (touch-action e
  //      user-select), logo abaixo no <style>.
  //   3. no fim chamava `location.reload()`. Mesmo contando os cinco, o painel
  //      só apareceria depois de recarregar — e um reload que demora é
  //      indistinguível de "o gesto não funcionou". Agora abre na hora.
  (function diagnostico() {
    const LIGADO = 'nm_diag';
    let cx = null, tique = null;
    const px = (n) => Math.round(n * 10) / 10;

    // Anatomia da barra: onde cada pixel dela é gasto. É o que separa
    // "a barra está no lugar errado" de "a barra é alta demais".
    function medirBarra() {
      const nav = document.querySelector('.pa-bottomnav');
      const item = nav && nav.querySelector('.pa-nav-item');
      if (!nav || !item) return 'nav      (ainda não montada)';
      const cn = getComputedStyle(nav), ci = getComputedStyle(item);
      const n = nav.getBoundingClientRect(), i = item.getBoundingClientRect();
      const svg = item.querySelector('svg');
      // O fim do RÓTULO, que é o último pixel de conteúdo de verdade.
      const texto = [].filter.call(item.childNodes, (x) => x.nodeType === 3 && x.textContent.trim())[0];
      let fimTexto = i.bottom;
      if (texto) { const r = document.createRange(); r.selectNode(texto); fimTexto = r.getBoundingClientRect().bottom; }
      const safe = getComputedStyle(document.documentElement).getPropertyValue('--pa-nav-safe').trim();
      return (
        `nav      top ${px(n.top)}  height ${px(n.height)}  bottom ${px(n.bottom)}\n` +
        `nav pad  top ${cn.paddingTop}  bottom ${cn.paddingBottom}  box ${cn.boxSizing}  minH ${cn.minHeight}\n` +
        `item     top ${px(i.top)}  height ${px(i.height)}  bottom ${px(i.bottom)}  minH ${ci.minHeight}\n` +
        `item pad top ${ci.paddingTop}  bottom ${ci.paddingBottom}  justify ${ci.justifyContent}\n` +
        `icone ${svg ? px(svg.getBoundingClientRect().height) : '—'}  rotulo fim ${px(fimTexto)}  safe ${safe}\n` +
        `>> do fim do texto ate o fim da barra: ${px(n.bottom - fimTexto)}\n` +
        `>> morto (fora a safe-area):           ${px(n.bottom - fimTexto - parseFloat(cn.paddingBottom))}`
      );
    }

    function ler() {
      if (!cx) return;
      const vv = window.visualViewport;
      const raiz = document.documentElement;
      const nav = document.querySelector('.pa-bottomnav');
      const cs = getComputedStyle(raiz);
      cx.textContent =
        `layout   innerHeight ${px(innerHeight)}  clientHeight ${px(raiz.clientHeight)}\n` +
        `visual   height ${vv ? px(vv.height) : '—'}  offsetTop ${vv ? px(vv.offsetTop) : '—'}  scale ${vv ? px(vv.scale) : '—'}\n` +
        `tela     screen ${px(screen.height)}x${px(screen.width)}  dpr ${devicePixelRatio}  standalone ${!!navigator.standalone}\n` +
        `insets   topo ${insets().topo}  base ${insets().base}\n` +
        `casca    --h ${cs.getPropertyValue('--pa-casca-h').trim() || '(vazia)'}  --top ${cs.getPropertyValue('--pa-casca-top').trim() || '(vazia)'}\n` +
        `barra    fim ${nav ? px(nav.getBoundingClientRect().bottom) : '—'}  sobra ${nav ? px(innerHeight - nav.getBoundingClientRect().bottom) : '—'}\n` +
        `sobra real ${nav ? px(screen.height - nav.getBoundingClientRect().bottom) : '—'} (contra a tela)\n` +
        medirBarra() +
        `\n· 5 toques no logo fecham`;
    }

    // Sonda invisível para ler os env() de safe-area direto da fonte, em vez de
    // deduzi-los do padding de algum componente.
    let sonda = null;
    function insets() {
      if (!sonda) {
        sonda = document.createElement('div');
        sonda.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
        document.body.appendChild(sonda);
      }
      const c = getComputedStyle(sonda);
      return { topo: c.paddingTop, base: c.paddingBottom };
    }

    function abrir() {
      if (cx) return;
      cx = document.createElement('pre');
      cx.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:6px 8px;background:#0E1A16;color:#7EE2C3;font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap';
      document.body.appendChild(cx);
      tique = setInterval(ler, 400);
      ler();
      try { localStorage.setItem(LIGADO, '1'); } catch (e) {}
    }

    function fechar() {
      if (!cx) return;
      clearInterval(tique);
      cx.remove();
      if (sonda) { sonda.remove(); sonda = null; }
      cx = null; tique = null;
      try { localStorage.setItem(LIGADO, '0'); } catch (e) {}
    }

    // `pointerup` cobre toque, caneta e mouse com um evento só, e chega antes
    // de o iOS decidir se aquilo é zoom ou seleção. Em capture, para não
    // depender de nenhum handler da tela deixar o evento subir.
    const EVENTO = window.PointerEvent ? 'pointerup'
                 : ('ontouchend' in window ? 'touchend' : 'click');
    let toques = 0, ultimo = 0;
    document.addEventListener(EVENTO, (e) => {
      const alvo = e.target && e.target.closest && e.target.closest('.pa-topbrand');
      if (!alvo) return;
      const agora = Date.now();
      // 1200ms entre toques: 800 exigia uma cadência que o dedo não sustenta.
      toques = agora - ultimo < 1200 ? toques + 1 : 1;
      ultimo = agora;
      if (toques < 5) return;
      toques = 0;
      if (cx) fechar(); else abrir();
    }, true);

    let pedido = false;
    try { pedido = localStorage.getItem(LIGADO) === '1'; } catch (e) {}
    if (new URLSearchParams(location.search).get('diag') !== '1' && !pedido) return;

    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', abrir);
    else abrir();
  })();
</script>

<style>
  /* As cores da marca vivem em css/tokens.css — ver o <link> antes de </head>. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* `dvh` depois de `%`: a viewport do iOS em modo standalone muda de altura
     entre o lançamento e a primeira interação, e `100%` resolve contra a
     medida ANTIGA. Quem não conhece dvh fica com o `%`, que continua acima.
     Isto vale para as telas SEM casca (entrar, vincular, boot, erro), que rolam
     na janela. Dentro da casca quem manda é `body.pa-app`, logo abaixo. */
  html, body { min-height: 100%; min-height: 100dvh; }

  /* Com a casca no ar, a página não rola — quem rola é o miolo, e só ele.
     A classe é posta por ligarShell() e tirada por semCasca(), em
     js/paciente-ui.js, junto da própria `.pa-shell`.
     Sem isto, a casca `fixed` não empurra o documento mas o `min-height` acima
     continua valendo: se a medida de viewport vier maior que a tela, sobra uma
     rolagem fantasma que não move nada e só produz o efeito elástico. */
  body.pa-app { overflow: hidden; min-height: 0; }
  /* Fundo chapado: os gradientes radiais quentes saíram com a identidade antiga. */
  body {
    background: var(--background);
    color: var(--text-primary);
    font-family: var(--font-sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* Sem `padding-bottom: env(safe-area-inset-bottom)` aqui. Quem encosta na
     borda de baixo é a barra, e é ela quem declara a safe-area — uma vez só.
     Repetir no body só acrescentaria uma tira morta no fim de TODAS as telas e
     faria o inset ser contado duas vezes. */
  em { font-style: italic; }
  a { color: inherit; }
  input, select, button { font-family: inherit; }
  /* Ícones minimalistas: traço mais fino em todo o app do aluno. */
  svg.lucide { stroke-width: 1.6; }

  /* ══════════════════════════════════════════════════════════════════════
     A CASCA — três faixas: topbar fixa, miolo que rola, barra no fundo
     ══════════════════════════════════════════════════════════════════════
     UMA casca só para Início, Treino, Dieta e treino em execução. As quatro
     telas montam `<header class="pa-topbar">`, `<main class="pa-main">` e a
     `<nav class="pa-bottomnav">` dentro deste mesmo `#app.pa-shell`, e é aqui
     — em lugar nenhum além daqui — que a geometria delas é decidida.

     A CASCA NÃO TEM ALTURA. Tem ÂNCORA. Essa é a coisa inteira.

     A versão anterior era `height: 100dvh` numa coluna flex, com a barra como
     último item. Em Chrome e Android isso funciona em todos os estados — foi
     medido: conteúdo menor, igual e maior que a tela, nas quatro telas, de 320
     a 1024px, sempre com a barra colada no fundo.

     No iPhone em standalone, não. `100dvh` é um NÚMERO que o navegador mede, e
     no lançamento do app o iOS mede a viewport errada — a mesma raiz que já
     tinha derrubado a tentativa anterior, quando a barra era `fixed; bottom: 0`.
     Quando esse número sai menor que a tela, a casca inteira fica curta: a
     barra sobe junto com ela e aparece uma faixa do fundo do body embaixo.
     Reproduzido injetando 44px de erro na medida — o sintoma é idêntico ao
     relatado.

     Trocar a barra de lugar nunca ia resolver, porque o erro nunca foi a barra:
     era a régua. `position: fixed; inset: 0` não usa régua nenhuma. Não é uma
     medida guardada, é uma restrição que o navegador reresolve a cada layout
     contra a viewport de verdade. Não existe valor errado para guardar.

     `--pa-casca-h` / `--pa-casca-top` entram por cima quando — e só quando — a
     visualViewport discorda da viewport de layout. É o caso do teclado virtual:
     o iOS encolhe a viewport VISUAL e deixa a de LAYOUT do mesmo tamanho, então
     `inset: 0` sozinho ancoraria a barra atrás do teclado. Quem escreve as duas
     variáveis é o bloco `ancorarCasca` no <script> do topo. Sem JS, sem
     visualViewport, ou com o teclado fechado, elas não existem e o `inset: 0`
     responde sozinho.

     Sem `overflow: hidden`. Ele estava aqui como cinto de segurança e virou
     mordaça: era ele que escondia o miolo transbordando 6px à direita a 360px
     — o corte do ✓ da série ficou meses invisível porque não havia barra de
     rolagem para denunciar. Sem ele, um estouro futuro aparece na hora. */
  #app.pa-shell {
    position: fixed;
    inset: 0;
    top: var(--pa-casca-top, 0px);
    height: var(--pa-casca-h, auto);
    display: flex; flex-direction: column;
  }
  .pa-shell .pa-main {
    flex: 1 1 auto; min-height: 0;   /* min-height: 0 senão o flex não deixa encolher e a rolagem some */
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;    /* a rolagem do miolo não vira rolagem da página atrás */
  }

  /* ── Boot / carregando ── */
  .pa-boot { min-height: 80vh; min-height: 80dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--ink-soft); padding: 24px; }
  .pa-boot svg { width: 34px; height: 34px; color: var(--gold); }
  .pa-spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--line); border-top-color: var(--moss); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
  .pa-spin-lg { width: 30px; height: 30px; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ── Auth / vincular ── */
  /* `dvh` depois de `vh`: no Safari a barra dinâmica muda a altura visível, e
     100vh é sempre a MAIOR — a tela de entrar nascia com rolagem inútil. Quem
     não conhece dvh fica com o vh, que continua na linha de cima. */
  .pa-auth { max-width: 420px; margin: 0 auto; padding: 40px 20px 32px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; }
  .pa-brand { text-align: center; margin-bottom: 22px; }
  .pa-brand-mark { width: 56px; height: 56px; margin: 0 auto 12px; background: linear-gradient(135deg, var(--moss), var(--olive)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--cream); font-size: 26px; font-weight: 600; font-style: italic; box-shadow: var(--shadow); }
  .pa-brand-name { font-size: 28px; font-weight: 500; }
  .pa-brand-name em { color: var(--moss); }
  .pa-brand-sub { color: var(--moss); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-top: 4px; }

  .pa-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
  .pa-tabs { display: flex; gap: 6px; background: var(--bg-warm); border-radius: 100px; padding: 4px; margin-bottom: 18px; }
  .pa-tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 100px; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: all 0.2s; }
  .pa-tab.active { background: var(--moss); color: var(--cream); }

  .pa-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 6px; }
  .pa-input { width: 100%; padding: 13px 15px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; color: var(--ink); transition: border-color 0.2s; }
  .pa-input:focus { outline: none; border-color: var(--moss); }
  .pa-codigo { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; text-align: center; font-size: 20px; }

  /* Mesma linguagem do "Ver treino": era 12px de raio, 15px/700 contra 13px de
     raio, 14,5px/800 — dois botões primários com dois pesos, na mesma tela. */
  .pa-btn { width: 100%; min-height: var(--pa-cta-h); margin-top: 20px; padding: 13px var(--pa-cta-pad-x); background: var(--moss); color: var(--cream); border: none; border-radius: var(--pa-cta-radius); font-size: var(--pa-cta-fs); font-weight: var(--pa-cta-fw); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .pa-btn:hover:not(:disabled) { background: var(--moss-deep); transform: translateY(-1px); }
  .pa-btn:disabled { opacity: 0.6; cursor: default; }
  .pa-btn svg { width: var(--pa-cta-svg); height: var(--pa-cta-svg); }

  .pa-msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: var(--error); text-align: center; }
  .pa-msg.ok { color: var(--moss); }
  .pa-hint { font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; line-height: 1.5; }
  .pa-foot { text-align: center; font-size: 12.5px; color: var(--ink-mute); margin-top: 20px; line-height: 1.5; }
  .pa-link { display: block; width: 100%; margin-top: 14px; background: none; border: none; color: var(--ink-mute); font-size: 13px; cursor: pointer; text-decoration: underline; }

  /* ── Topbar ── */
  /* `max`, não soma. O inset já é a distância exata que afasta da barra de
     status; somar mais 12px dá folga em cima de folga e a topbar sai de 55px
     para 102px no iPhone — 47px roubados de TODAS as telas, no lugar da tela
     onde o conteúdo deveria estar. Sem inset (desktop, Android), os 12px
     continuam valendo. */
  .pa-topbar { flex: 0 0 auto; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 18px 12px; background: rgba(255,255,255,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  /* `touch-action: manipulation` desliga o double-tap-to-zoom AQUI, e
     `user-select: none` impede que o segundo toque comece a selecionar a
     palavra "Evollo". Sem os dois, o iOS reinterpreta a sequência de toques
     como zoom ou seleção no meio do caminho e engole os eventos — era o que
     matava o gesto de cinco toques que abre o diagnóstico. Não muda nada do
     que se vê: o logo não é selecionável nem ampliável de propósito. */
  .pa-topbrand {
    font-size: 19px; font-weight: 500; display: flex; align-items: center; gap: 8px;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .pa-topbrand em { color: var(--moss); }
  .pa-topmark { width: 30px; height: 30px; background: linear-gradient(135deg, var(--moss), var(--olive)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--cream); font-size: 15px; font-weight: 600; font-style: italic; }
  .pa-topuser { display: flex; align-items: center; gap: 8px; }
  .pa-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--sage), var(--moss-light)); color: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .pa-username { font-size: 14px; font-weight: 600; }
  .pa-logout { background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 6px; display: flex; border-radius: 8px; }
  .pa-logout:hover { background: var(--bg-warm); color: var(--ink); }
  .pa-logout svg { width: 19px; height: 19px; }

  /* Geometria da barra inferior, num lugar só. Quem mede a barra, mede a
     reserva do conteúdo e mede a barra de finalizar do treino — as três saem
     daqui, e por isso não têm como divergir.

     A ÁREA ÚTIL é só respiro de cima + altura de toque do item. A safe-area
     NÃO entra nela: é padding da barra, e mora em --pa-nav-safe.

     Antes a área útil era 66px e os itens (57px de conteúdo) eram
     centralizados dentro dela — sobravam ~4,5px de folga que, somados ao
     padding do item e à safe-area, viravam ~46px de branco abaixo do rótulo
     quando só 34 são obrigatórios. Agora a altura do item É a área de toque:
     não há caixa maior para centralizar dentro.

     O respiro de cima era contado DUAS VEZES, e a auditoria da barra achou:
     `--pa-nav-item-h` valia 43px como se fosse só o conteúdo, mas o item tem o
     `box-sizing: border-box` global — 43px já INCLUÍAM o padding de cima. A
     área útil somava esse mesmo padding de novo (9 + 43 = 52), a barra pedia
     52px de conteúdo, o item media 49px de verdade e o `align-items: stretch`
     esticava a diferença. Os 3px sobravam mortos embaixo do rótulo, somados à
     safe-area. Agora a variável diz o que mede: a altura REAL do item, padding
     incluído, e a barra não pede altura nenhuma além dela. */
  :root {
    --pa-nav-pad-top: 9px;    /* respiro acima do ícone */
    /* Altura real do item, COM o padding de cima (border-box):
       9 (respiro) + 22 (ícone) + 3 (gap) + 15 (rótulo) = 49px.
       É também o alvo de toque, e por isso não desce de 44px. */
    --pa-nav-item-h: 49px;

    /* A safe-area REAL do aparelho, com um PISO de respiro. Declarada UMA vez e
       usada como variável — é o que impede a mesma medida de ser escrita em
       dois lugares e sair de sincronia.

       O piso de 10px não é decoração nem palpite: com a folga morta zerada,
       abaixo do rótulo passou a existir exatamente esta variável e mais nada.
       Onde o aparelho tem indicador Home, os 34px dele já são o respiro, e é
       assim que a tab bar do próprio iOS se comporta — o rótulo encosta no
       topo da área do indicador. Onde não tem (Android, desktop, iPhone antigo)
       o inset vale 0, e sem piso o rótulo ficaria colado na borda: os 10px são
       o respiro nesses casos. Um `max()` cobre os dois sem um `if` de aparelho. */
    --pa-nav-safe: max(10px, env(safe-area-inset-bottom, 0px));
  }
  /* Não existe mais --pa-nav-reserva. A barra é o último item da coluna flex
     da casca: ela não cobre o conteúdo, e conteúdo que não é coberto não tem
     o que reservar. Era essa reserva — escrita em dois lugares, cancelada com
     `:has()` num terceiro — que produzia o vão embaixo do último cartão. */

  /* ══════════════════════════════════════════════════════════════════════
     A COLUNA DE CONTEÚDO — a mesma nas três telas
     ══════════════════════════════════════════════════════════════════════
     Início, Treino e Dieta usam este mesmo <main>. A largura, o recuo lateral
     e o teto vêm de tokens (--pa-conteudo-*), porque três telas com a mesma
     função não podem ter três medidas.

     Sem reserva embaixo: a barra deixou de cobrir o conteúdo quando virou item
     da coluna flex da casca — ver o bloco A CASCA lá em cima.

     `width: 100%` NÃO é decoração, e tirá-lo devolve um defeito difícil de
     ler. A casca é `display: flex; flex-direction: column`, então o eixo
     transversal do <main> é o HORIZONTAL — e `margin: 0 auto` num item flex
     DESLIGA o `stretch` nesse eixo. Sem `width`, a largura do <main> passa
     a ser shrink-to-fit: o maior entre o min-content do conteúdo e o espaço
     disponível, limitado ao max-content.

     O que isso produzia, medido:
       · a 360px o <main> ficava com 366px dentro de uma casca de 360 que tem
         `overflow: hidden` — 6px recortados à direita, comendo a borda do
         card e metade do ✓ de cada série. Sem barra de rolagem horizontal
         nenhuma, porque não era estouro: era corte;
       · a 412 e 430px o recuo lateral virava 23 e 32px em vez dos 16 daqui,
         porque o <main> parava de crescer no max-content do texto;
       · a 768px o max-width nem chegava a valer: o <main> ficava com a largura
         da frase mais longa da tela, diferente em cada uma das três.

     Ou seja: as três telas tinham larguras úteis diferentes sem que ninguém
     tivesse escrito medida diferente em lugar nenhum. `width: 100%` devolve
     o `stretch`, e o max-width volta a ser quem manda. */
  .pa-main {
    width: 100%;
    max-width: var(--pa-conteudo-max);
    margin: 0 auto;
    padding: 18px var(--pa-conteudo-pad);
  }

  /* ══════════════════════════════════════════════════════════════════════
     NAVEGAÇÃO INFERIOR (Início | Treino | Dieta)
     ══════════════════════════════════════════════════════════════════════
     Fonte única: bottomNav() em js/paciente-ui.js monta esta barra, e TODAS as
     telas do app do aluno a usam. Não existe .inicio-bottomnav nem
     .dt-bottomnav — três implementações voltariam a divergir.

     A barra é o ÚLTIMO ITEM da coluna flex da casca — não é mais um elemento
     `fixed`. Dashboard curto, dieta longa, estado vazio, loading ou erro:
     sempre no fim da casca, que por sua vez ocupa a viewport dinâmica. Foi
     trocar `fixed` por isto que resolveu a barra parando acima do fim da tela
     no iOS; o motivo inteiro está no bloco A CASCA.

     Safe-area UMA vez, aqui, e SÓ como padding interno de baixo: é o que faz o
     rótulo parar logo acima do indicador Home em vez de embaixo dele.

     A altura NÃO é fixa e NÃO é pedida aqui: é a do item mais a safe-area real
     do aparelho, e só. Nada de 120/130/150px chumbado, que seria certo num
     modelo e errado em todos os outros — e nada de `min-height` próprio, que
     era o que esticava o item além do que ele mede e deixava folga morta
     embaixo do rótulo. Quem define a altura é quem tem conteúdo: o item. */
  .pa-bottomnav {
    flex: 0 0 auto; z-index: 30;
    display: flex; align-items: stretch;
    padding-top: 0;
    padding-bottom: var(--pa-nav-safe);
    /* Fundo OPACO, sem backdrop-filter. O blur obriga o navegador a compor a
       barra numa camada própria alimentada pelo que passa atrás dela — e é aí
       que o WebView do Android, quando o conteúdo troca de altura embaixo de
       um elemento `fixed`, reaproveita a camada antiga e desenha a barra onde
       ela estava. Translúcido era enfeite; a barra encostada no fim da tela
       não é. Um fundo chapado não tem camada para envelhecer. */
    background: var(--bg-card);
    border-top: 1px solid var(--line);
  }
  /* Nada de pseudo-elemento prolongando o fundo para baixo. Eram 80px pintados
     com a cor da própria barra logo abaixo dela: onde o fim do viewport não
     coincide com o fim da tela, esses 80px viram uma faixa vazia da cor da
     barra — exatamente o "menu boiando no meio da tela". A tira do gesto do
     Android se resolve com viewport-fit=cover no <meta>, que já está lá. */
  /* O item NÃO tem padding embaixo, e o conteúdo começa no topo
     (`flex-start`). Centralizar dentro de uma caixa maior que o conteúdo é o
     que empurrava o rótulo para longe do indicador Home: a folga ia parar
     TODA embaixo dele, somada à safe-area. O respiro de cima é explícito e
     mora em --pa-nav-pad-top; embaixo do rótulo só existe a safe-area.
     `line-height: 1.1` no rótulo pelo mesmo motivo — o 1.55 herdado do body
     virava ~6px de entrelinha invisível dentro de um texto de uma linha só. */
  .pa-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; min-height: var(--pa-nav-item-h); padding: var(--pa-nav-pad-top) 4px 0; background: none; border: none; cursor: pointer; color: var(--ink-mute); font-size: 12px; line-height: 1.1; font-weight: 700; font-family: inherit; transition: color 0.15s; }
  .pa-nav-item svg { width: 22px; height: 22px; }
  .pa-nav-item.active { color: var(--moss); }
  .pa-select { padding: 9px 12px; border: 1px solid var(--hair); border-radius: 10px; background: var(--bg-card); font-size: 13.5px; color: var(--ink); max-width: 100%; }

  /* ── Hero: tela inicial do treino do dia ── */
  .pa-hero { background: linear-gradient(150deg, var(--bg-card) 0%, #EEF2EB 100%); border-radius: 20px; padding: 20px 20px 17px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .pa-hero-hi { font-size: var(--pa-fs-sub); font-weight: 600; color: var(--ink-soft); }
  .pa-hero-title { font-size: var(--pa-fs-hero); font-weight: 800; color: var(--moss-deep); line-height: 1.08; letter-spacing: -0.015em; margin-top: 2px; }
  .pa-hero-sel { margin-top: 11px; }
  .pa-hero-bar { margin-top: 17px; height: 7px; border-radius: 100px; background: #E4E7E0; overflow: hidden; }
  .pa-hero-bar > span { display: block; height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--moss), var(--sage)); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .pa-hero-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .pa-hero-count b { color: var(--moss-deep); font-weight: 800; }
  .pa-hero-time { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-mute); }
  .pa-hero-time svg { width: 14px; height: 14px; }
  /* ══════════════════════════════════════════════════════════════════════
     TREINO EM ANDAMENTO — cabeçalho fixo, cronômetro e barra de finalizar
     ══════════════════════════════════════════════════════════════════════ */
  /* Altura da topbar (12 + avatar 30 + 12). A da navegação inferior mora lá em
     cima, junto da própria barra — ver --pa-nav-h. */
  :root { --pa-top-h: 54px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* Treino em andamento tem DUAS barras embaixo: a navegação e a .pa-finishbar
     logo acima dela. Nenhuma das duas cobre o miolo — as três são itens da
     mesma coluna. A largura também não é mais assunto daqui: o treino aberto
     media 720px contra os 620 das outras telas, e era a mesma tela do aluno
     mudando de tamanho quando ele tocava num card. Agora é --pa-conteudo-max,
     como todo o resto. */

  /* Cabeçalho do treino: acompanha a rolagem, logo abaixo da topbar. */
  /* `top: 0`: quem rola agora é o `<main>`, e a topbar está FORA dele. Descontar
     a altura da topbar aqui deixaria o cabeçalho do treino grudado 54px abaixo
     do topo da área que rola, com uma faixa morta em cima dele. */
  .pa-runbar { position: sticky; top: 0; z-index: 15;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 14px 13px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .pa-runbar-row { display: flex; align-items: center; gap: 10px; }
  .pa-runbar-back { flex: 0 0 auto; width: 34px; height: 34px; margin-left: -4px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 10px; background: none; color: var(--text-secondary); cursor: pointer; }
  .pa-runbar-back:hover { background: var(--surface-subtle); color: var(--text-primary); }
  .pa-runbar-back svg { width: 20px; height: 20px; }
  .pa-runbar-id { flex: 1 1 auto; min-width: 0; }
  .pa-runbar-title { font-size: 19px; font-weight: 800; color: var(--text-primary); line-height: 1.15; letter-spacing: var(--tracking-snug); }
  .pa-runbar-sub { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-runbar-prog { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .pa-runbar-prog b { color: var(--text-primary); font-weight: 800; }
  .pa-runbar-pct { font-size: 12.5px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
  .pa-runbar .pa-hero-bar { margin-top: 6px; height: 6px; background: var(--surface-subtle); }
  .pa-runbar .pa-hero-bar > span { background: var(--primary); }

  /* Cronômetro (ou, antes de começar, o tempo estimado). */
  .pa-cron { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding: 5px 11px; border-radius: 12px; background: var(--color-primary-100); }
  .pa-cron-lab { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-primary-700); }
  .pa-cron-tempo { font-size: 19px; font-weight: 800; line-height: 1.1; color: var(--color-primary-900); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .pa-cron-off { background: var(--surface-subtle); }
  .pa-cron-off .pa-cron-lab { color: var(--text-secondary); }
  .pa-cron-off .pa-cron-tempo { font-size: 16px; color: var(--text-primary); }
  .pa-cron-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: paPulse 1.8s ease-in-out infinite; }
  @keyframes paPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { .pa-cron-dot { animation: none; } }

  /* Barra de finalizar: fica acima do menu inferior, sem cobri-lo. */
  /* Também item da casca, logo acima da navegação — a marcação já a põe entre
     o <main> e a barra. Era `fixed` medida por --pa-nav-h + --pa-nav-safe, o
     que a deixava exposta ao mesmo erro de viewport do iOS que levantava a
     barra inferior. Em fluxo não há medida para acertar: ela é a penúltima
     linha da coluna, e a navegação é a última. */
  .pa-finishbar { flex: 0 0 auto; z-index: 25;
    background: linear-gradient(to top, var(--background) 62%, color-mix(in srgb, var(--background) 0%, transparent)); pointer-events: none; }
  /* Mesma coluna dos cards, pelo mesmo token. Com o <main> em shrink-to-fit e
     esta barra respeitando o próprio max-width, as duas divergiam: a 768px o
     "Iniciar treino" tinha 688px de largura contra 638 dos cards logo acima —
     25px de desalinhamento de cada lado, no elemento mais visível da tela. */
  .pa-finishbar-in { max-width: var(--pa-conteudo-max); margin: 0 auto; padding: 14px var(--pa-conteudo-pad) 10px; pointer-events: auto; }
  .pa-finishbar .pa-btn { margin-top: 0; box-shadow: var(--shadow-md); }

  /* ── Indicadores de evolução (topo): sequência + recordes ── */
  .pa-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .pa-stat { background: var(--bg-card); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 15px; box-shadow: var(--shadow); }
  .pa-stat-top { display: flex; align-items: center; gap: 6px; font-size: var(--pa-fs-rotulo); font-weight: 700; color: var(--ink-mute); }
  .pa-stat-ic { font-size: 15px; line-height: 1; }
  .pa-stat-val { margin-top: 7px; font-size: var(--pa-fs-num); font-weight: 800; color: var(--moss-deep); line-height: 1; letter-spacing: -0.01em; }
  .pa-stat-val small { font-size: var(--pa-fs-num-un); font-weight: 700; color: var(--ink-soft); margin-left: 3px; }

  /* ── Tela de seleção de dia (lista) ── */
  .pa-hero-sub { margin-top: 8px; font-size: var(--pa-fs-sub); font-weight: 600; color: var(--ink-soft); }
  .pa-hero-sub b { color: var(--moss-deep); font-weight: 800; }
  .pa-lista-sel { margin-bottom: 14px; }
  .pa-diacards { display: flex; flex-direction: column; gap: 11px; }
  .pa-diacard { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: var(--bg-card); border: 1px solid var(--hair); border-radius: var(--pa-card-radius); padding: var(--pa-card-pad-y) var(--pa-card-pad-x); box-shadow: var(--shadow); cursor: pointer; font-family: inherit; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; }
  .pa-diacard:hover { transform: translateY(-1px); }
  .pa-diacard.prox { border-color: var(--sage); background: linear-gradient(150deg, var(--bg-card) 0%, #EEF3EC 100%); }

  /* Card em destaque: o treino "PRÓXIMO" — principal ação da tela */
  .pa-diacard.featured { display: block; padding: 16px 16px 15px; cursor: default; border: 1.5px solid var(--sage); background: linear-gradient(155deg, #FCFEFB 0%, #E9F1E6 100%); box-shadow: 0 2px 4px rgba(60,77,63,0.05), 0 12px 26px rgba(60,77,63,0.11); }
  .pa-diacard.featured:hover { transform: none; }
  .pa-dc-head { display: flex; align-items: center; gap: 13px; }
  .pa-dc-headtext { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .pa-diacard.featured .pa-dc-nome { font-size: 18px; }
  .pa-dc-info { margin-top: 14px; }
  .pa-dc-grupos { font-size: 13px; font-weight: 700; color: var(--moss-deep); line-height: 1.35; }
  .pa-dc-conta { margin-top: 3px; font-size: var(--pa-fs-meta); font-weight: 600; color: var(--ink-mute); }
  /* A RÉGUA dos CTAs do app do aluno. "Iniciar treino", os atalhos do Início e
     os botões da Dieta seguem estes mesmos tokens — ver --pa-cta-* em
     css/tokens.css. Altere lá, não aqui. */
  .pa-dc-cta { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: var(--pa-cta-h); margin-top: 16px; padding: 13px var(--pa-cta-pad-x); border: none; border-radius: var(--pa-cta-radius); background: var(--moss); color: var(--cream); font-family: inherit; font-size: var(--pa-cta-fs); font-weight: var(--pa-cta-fw); cursor: pointer; transition: background 0.2s, transform 0.15s; }
  .pa-dc-cta:hover { background: var(--moss-deep); transform: translateY(-1px); }
  .pa-dc-cta svg { width: var(--pa-cta-svg); height: var(--pa-cta-svg); }

  .pa-dc-letra { flex: 0 0 auto; width: var(--pa-ic-card); height: var(--pa-ic-card); border-radius: 13px; background: var(--cream); color: var(--moss-deep); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
  .pa-diacard.prox .pa-dc-letra { background: var(--moss); color: var(--cream); }
  .pa-dc-body { flex: 1 1 auto; min-width: 0; }
  .pa-dc-top { display: flex; align-items: center; gap: 8px; }
  .pa-dc-nome { font-size: var(--pa-fs-card); font-weight: 800; color: var(--ink); }
  .pa-dc-sub { display: block; margin-top: 3px; font-size: var(--pa-fs-meta); font-weight: 600; color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-dc-meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .pa-dc-meta svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .pa-dc-badge { flex: 0 0 auto; font-size: var(--pa-fs-selo); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .pa-dc-badge.prox { background: var(--moss); color: var(--cream); }
  .pa-dc-badge.andamento { display: inline-flex; align-items: center; gap: 6px; background: var(--moss); color: var(--cream); font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; padding: 4px 9px; }
  .pa-dc-badge.feito { background: color-mix(in srgb, var(--color-primary-400) 18%, transparent); color: var(--moss-deep); }
  .pa-dc-arrow { flex: 0 0 auto; color: var(--ink-mute); display: flex; }
  .pa-dc-arrow svg { width: 20px; height: 20px; }

  /* ── Página do treino: voltar + finalizar ── */
  .pa-back { display: inline-flex; align-items: center; gap: 3px; background: none; border: none; color: var(--ink-mute); font-size: 13.5px; font-weight: 700; font-family: inherit; cursor: pointer; padding: 4px 8px 4px 2px; margin-bottom: 10px; border-radius: 8px; }
  .pa-back svg { width: 18px; height: 18px; }
  .pa-back:hover { color: var(--moss); }
  .pa-finalizar { margin-top: 18px; }

  .pa-dias { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .pa-dia { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.18s; }
  .pa-dia.active { background: var(--primary); color: #FFFFFF; border-color: var(--primary); }

  /* ══════════════════════════════════════════════════════════════════════
     CARD DE EXERCÍCIO — acordeão: fechado é só o resumo; aberto, a execução
     ══════════════════════════════════════════════════════════════════════ */
  #paDiaConteudo { display: flex; flex-direction: column; gap: 8px; }
  .pa-ex { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-xs); transition: border-color var(--duration-base) var(--ease), box-shadow var(--duration-base) var(--ease); }

  /* Cabeçalho clicável (estado fechado ≈ 76px) */
  .pa-exh { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 64px; padding: 9px 12px; background: none; border: none; border-radius: 14px; text-align: left; font-family: inherit; cursor: pointer; }
  .pa-exh:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
  .pa-ex-status { flex: 0 0 auto; width: 29px; height: 29px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .pa-ex-status svg { width: 17px; height: 17px; }
  .pa-exh-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .pa-exh-nome { font-size: 14.5px; font-weight: 700; color: var(--text-primary); line-height: 1.25; letter-spacing: var(--tracking-snug); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-exh-grupo { font-size: 10px; font-weight: 800; color: var(--color-primary-700); text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.4; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-exh-resumo { font-size: 12px; font-weight: 600; color: var(--text-secondary); line-height: 1.35; margin-top: 1px; }
  .pa-exh-estado { flex: 0 0 auto; }
  .pa-ex-tag { display: none; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .pa-ex-tag svg { width: 12px; height: 12px; }
  .pa-exh-chev { flex: 0 0 auto; display: flex; color: var(--text-muted); transition: transform var(--duration-base) var(--ease); }
  .pa-exh-chev svg { width: 19px; height: 19px; }

  /* A · Pendente (padrão) · destaque discreto no próximo da fila */
  .pa-ex.next { border-color: var(--color-primary-300); }
  .pa-ex.next .pa-ex-status { border-color: var(--color-primary-400); color: var(--color-primary-700); }

  /* B · Em andamento (aberto) */
  .pa-ex.open { border-color: var(--primary); box-shadow: var(--shadow-md); }
  .pa-ex.open .pa-ex-status { border-color: var(--primary); background: var(--color-primary-100); color: var(--color-primary-700); }
  .pa-ex.open .pa-exh-chev { transform: rotate(180deg); }
  .pa-ex.open .pa-tag-run { display: inline-flex; background: var(--color-primary-100); color: var(--color-primary-700); }
  .pa-ex.open .pa-exh-resumo { display: none; }

  /* C · Concluído (verde da marca — nunca laranja) */
  .pa-ex.done .pa-ex-status { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .pa-ex.done:not(.open) .pa-tag-done { display: inline-flex; background: var(--color-primary-100); color: var(--color-primary-700); }
  .pa-ex.done:not(.open) .pa-exh-nome { color: var(--text-primary); }
  .pa-ex.done:not(.open) .pa-exh-grupo,
  .pa-ex.done:not(.open) .pa-exh-resumo { color: var(--text-muted); }
  .pa-ex.done.open .pa-tag-run { display: inline-flex; }

  /* Conteúdo expandido */
  .pa-ex-body { padding: 2px 14px 14px; border-top: 1px solid var(--border); margin: 0 0 0; }
  .pa-ex-body[hidden] { display: none; }
  .pa-ex-body > :first-child { margin-top: 13px; }
  /* Abaixo de 380px o que cede é a GEOMETRIA, nunca a tipografia: o campo
     continua em 16px (menos que isso e o iOS dá zoom sozinho ao focar) e a
     altura de toque do input e do ✓ continua acima de 44px. O que encolhe é a
     coluna do número, o vão entre colunas e o respiro lateral de dentro do
     campo — nada disso é alvo de dedo. */
  @media (max-width: 380px) {
    .pa-ex-tag { display: none !important; }
    .pa-serie { --pa-serie-c1: 26px; --pa-serie-gap: 8px; }
    .pa-serie .pa-mini { padding-left: 8px; padding-right: 8px; }
  }

  /* 2 · Linha compacta de prescrição */
  .pa-ex-spec { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }
  .pa-ex-spec b { color: var(--ink); font-weight: 800; }
  .pa-ex-spec .sep { color: #CBCBC7; }
  .pa-ex-tec { display: inline-flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--warning) 13%, transparent); color: #927023; padding: 2px 9px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-ex-tec svg { width: 12px; height: 12px; }

  .pa-metodo { margin-top: 12px; background: color-mix(in srgb, var(--warning) 8%, transparent); border-left: 2px solid var(--gold-soft, var(--gold)); border-radius: 8px; padding: 9px 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
  .pa-metodo svg { width: 13px; height: 13px; color: var(--gold); vertical-align: -2px; }
  .pa-obs { margin-top: 11px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; }
  .pa-obs svg { width: 13px; height: 13px; color: var(--ink-mute); vertical-align: -2px; }
  .pa-obs-tec { color: var(--ink-mute); }

  /* 3-4 · Último treino + evolução (painel sem contorno, só um leve tom verde) */
  .pa-ex-last { margin-top: 15px; background: var(--surface-subtle); border-radius: 12px; padding: 11px 13px; }
  .pa-last-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pa-last-lab { font-size: 10px; font-weight: 800; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.07em; }
  .pa-last-val { margin-top: 5px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }
  .pa-last-val b { color: var(--moss-deep); font-weight: 800; }
  .pa-last-date { color: var(--ink-mute); font-weight: 600; }
  .pa-last-vazio { margin-top: 4px; font-size: 12.5px; color: var(--ink-mute); font-weight: 600; font-style: italic; }
  .pa-evo { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .pa-evo svg { width: 14px; height: 14px; }
  .pa-evo.up { color: var(--moss); }
  .pa-evo.flat, .pa-evo.down { color: var(--ink-mute); }

  /* 5 · Vídeo do exercício (dentro do card aberto) */
  .pa-ex-foot { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .pa-video { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px; font-weight: 700; color: var(--moss); text-decoration: none; padding: 8px 12px; border-radius: 10px; background: var(--bg-warm); }
  .pa-video svg { width: 15px; height: 15px; }
  /* O player no card. `aspect-ratio` fixo em retrato porque os clipes de
     demonstração são verticais e o card não pode pular de altura quando o
     vídeo carrega — layout que salta no meio de um treino faz o aluno perder
     o dedo do botão de série. `background` escuro para a barra preta do
     vídeo não brigar com o fundo claro do card. */
  .pa-midia { margin-top: 13px; }
  .pa-midia-v {
    width: 100%; max-width: 320px; aspect-ratio: 9 / 16;
    display: block; border-radius: 12px; background: #12140F;
    object-fit: cover;
  }

  /* ── Progressão ── */
  .pa-prog { margin-top: 16px; border-top: 1px solid var(--hair); padding-top: 16px; }
  .pa-prog-head { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--moss-deep); margin-bottom: 10px; }
  .pa-prog-head svg { width: 16px; height: 16px; color: var(--moss); }
  .pa-prog-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pa-mini { padding: 10px 12px; font-size: 16px; }   /* 16px evita zoom automático no iOS */
  .pa-prog-form [data-p="obs"] { grid-column: 1 / -1; }
  .pa-btn-mini { grid-column: 1 / -1; margin-top: 2px; min-height: var(--pa-cta-h); padding: 12px var(--pa-cta-pad-x); font-size: var(--pa-cta-fs); font-weight: var(--pa-cta-fw); }
  .pa-btn-mini.is-loading { opacity: 0.75; cursor: progress; }

  .pa-prog-list { display: flex; flex-direction: column; gap: 6px; }
  .pa-prog-row { display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 9px; padding: 8px 10px; font-size: 13px; }
  .pa-prog-data { color: var(--ink-mute); font-weight: 600; }
  .pa-prog-carga { color: var(--moss-deep); font-weight: 700; }
  .pa-prog-reps { color: var(--ink-soft); }
  .pa-prog-obs { color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-prog-del { background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 3px; display: flex; }
  .pa-prog-del:hover { color: var(--error); }
  .pa-prog-del svg { width: 15px; height: 15px; }
  .pa-prog-vazio { font-size: 13px; color: var(--ink-mute); text-align: center; padding: 6px 0 2px; }

  /* Registro por série (peso + reps de cada série) */
  .pa-prog-when { font-size: 11.5px; font-weight: 600; color: var(--ink-mute); margin-left: auto; }
  .pa-series { display: flex; flex-direction: column; gap: 11px; margin-bottom: 12px; }
  /* nº | peso | reps | ✓ — as quatro colunas SEMPRE visíveis, em toda largura.
     As medidas vêm de tokens porque o selo do drop set e a comparação com a
     última vez se alinham à primeira coluna: com o 42px chumbado em cada um
     deles, apertar o grid no celular estreito desalinhava os três de uma vez.
     `minmax(0, 1fr)` em vez de `1fr`: o mínimo automático de uma coluna
     `1fr` é o min-content do que está dentro, e um <input> tem largura
     intrínseca própria (~20 caracteres). Enquanto houver espaço não muda nada;
     quando não houver, é ele que impede a coluna de recusar-se a encolher. */
  .pa-serie {
    display: grid;
    grid-template-columns: var(--pa-serie-c1) minmax(0, 1fr) minmax(0, 1fr) var(--pa-serie-c4);
    gap: var(--pa-serie-gap);
    align-items: center;
  }
  .pa-serie-num { font-size: 14px; font-weight: 800; color: var(--moss); text-align: center; }
  .pa-serie-lab { padding-bottom: 0; }
  .pa-serie-lab span { font-size: 11px; font-weight: 600; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-serie .pa-mini { text-align: center; min-height: 44px; }
  /* Botão de concluir cada série — círculo discreto; estado concluído preenchido */
  .pa-serie-check { justify-self: end; width: 36px; height: 36px; padding: 0; border: 1px solid var(--hair); border-radius: 50%; background: var(--bg); color: var(--ink-mute); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
  .pa-serie-check svg { width: 17px; height: 17px; }
  .pa-serie-check:hover { border-color: var(--sage); color: var(--moss); }
  /* Série concluída — a classe `done` fica no bloco (.pa-serie-block) */
  .pa-serie-block.done .pa-serie-check { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .pa-serie-block.done .pa-serie-num { color: var(--color-primary-500); }
  .pa-serie-block.done .pa-serie .pa-mini { border-color: transparent; background: color-mix(in srgb, var(--color-primary-400) 12%, transparent); color: var(--moss-deep); font-weight: 700; }
  .pa-series-prog { font-size: 12px; font-weight: 700; color: var(--ink-mute); margin: 2px 0 12px 2px; }
  .pa-series-prog b { color: var(--moss); }
  .pa-btn-mini.pa-btn-ready { box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary-400) 25%, transparent); }

  /* ── Drop set — sub-série vinculada à série principal ── */
  .pa-serie-block { display: flex; flex-direction: column; }
  /* Selo discreto "DROP SET" sob a linha da série */
  .pa-drop-badge { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
    margin: 7px 0 0 var(--pa-serie-recuo); padding: 3px 9px; border-radius: 7px;
    background: var(--plum-soft); color: var(--plum);
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
  .pa-drop-badge svg { width: 13px; height: 13px; }
  .pa-serie-block.drop-done .pa-drop-badge,
  .pa-serie-block.drop-done .pa-serie { display: none; }

  /* Painel do drop — expande/recolhe suave via grid-template-rows */
  .pa-drop-wrap { display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows 0.22s ease, opacity 0.22s ease; }
  .pa-serie-block.drop-open .pa-drop-wrap { grid-template-rows: 1fr; opacity: 1; }
  .pa-drop-inner { overflow: hidden; }
  .pa-drop { margin: 10px 0 2px 20px; padding: 12px 14px; border-left: 2px solid var(--plum-line);
    background: var(--plum-soft); border-radius: 0 12px 12px 0; }
  .pa-drop-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800;
    color: var(--plum); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 11px; }
  .pa-drop-head svg { width: 15px; height: 15px; }
  .pa-drop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pa-drop-field { display: flex; flex-direction: column; gap: 5px; }
  .pa-drop-lab { font-size: 11px; font-weight: 700; color: var(--ink-soft); display: flex; gap: 5px; align-items: baseline; }
  .pa-drop-alvo { font-weight: 700; color: var(--plum); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-drop-hint { font-size: 10.5px; color: var(--ink-mute); }
  .pa-btn-drop { margin-top: 12px; width: 100%; display: inline-flex; align-items: center; justify-content: center;
    gap: 7px; padding: 11px; min-height: 44px; border: none; border-radius: 11px;
    background: var(--plum); color: #fff; font-size: 13.5px; font-weight: 800; cursor: pointer;
    transition: background 0.15s, transform 0.1s; }
  .pa-btn-drop svg { width: 16px; height: 16px; }
  .pa-btn-drop:hover { background: #6b5975; }
  .pa-btn-drop:active { transform: translateY(1px); }

  /* Resumo compacto quando a série (principal + drop) está concluída */
  .pa-serie-resumo { display: none; width: 100%; align-items: center; gap: 9px; text-align: left;
    padding: 9px 11px; border: 1px solid var(--hair); border-radius: 11px; background: var(--bg);
    cursor: pointer; font: inherit; min-height: 44px; }
  .pa-serie-block.drop-done .pa-serie-resumo { display: flex; }
  .pa-res-check { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: var(--primary); color: #fff; align-items: center; justify-content: center; }
  .pa-res-check svg { width: 14px; height: 14px; }
  .pa-res-main { font-size: 13px; color: var(--moss-deep); font-weight: 700; }
  .pa-res-drop { display: inline-flex; align-items: center; gap: 4px; margin-left: auto;
    font-size: 12px; font-weight: 700; color: var(--plum); white-space: nowrap; }
  .pa-res-drop svg { width: 13px; height: 13px; }

  /* Validação inline (sem alert do navegador) */
  .pa-field-err { color: var(--danger); font-size: 11.5px; font-weight: 700; margin-top: 7px; }
  .pa-field-err:empty { display: none; }
  .pa-input-err { border-color: #D98A76 !important; box-shadow: 0 0 0 2px color-mix(in srgb, var(--error) 15%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    .pa-drop-wrap { transition: none; }
  }

  /* ── Bi-set (grupo A + B) no app do aluno ── */
  .pa-biset { border: 1.5px solid var(--sage); border-radius: var(--radius); background: color-mix(in srgb, var(--color-primary-400) 6%, transparent); padding: 12px; margin-bottom: 14px; }
  .pa-biset-head { display: flex; align-items: center; gap: 9px; margin: 2px 4px 10px; }
  .pa-biset-selo { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; background: rgba(60,77,63,0.10); color: var(--moss-deep); font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .pa-biset-selo svg { width: 14px; height: 14px; }
  .pa-biset-n { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--ink-mute); }
  .pa-biset .pa-ex { box-shadow: none; border: 1px solid var(--border); margin-bottom: 0; }
  .pa-biset-conector { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 9px 0; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--olive); }
  .pa-biset-conector svg { width: 14px; height: 14px; }
  .pa-biset-descanso { display: flex; align-items: center; gap: 7px; margin-top: 11px; padding: 10px 13px; border-radius: 12px; background: var(--bg-warm); font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .pa-biset-descanso b { color: var(--moss-deep); font-weight: 800; }
  .pa-biset-descanso svg { width: 15px; height: 15px; color: var(--moss); }
  .pa-biset-incompleto { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--warning) 10%, transparent); color: #8a6d1e; font-size: 12.5px; font-weight: 600; }
  .pa-biset-incompleto svg { width: 15px; height: 15px; flex: none; }

  /* ── Lembrete "Treino atualizado" ── */
  .pa-lembrete { display: flex; align-items: center; gap: 11px; margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--warning) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); }
  .pa-lembrete > svg { width: 20px; height: 20px; color: var(--gold); flex: none; }
  .pa-lembrete-txt { display: flex; flex-direction: column; line-height: 1.3; }
  .pa-lembrete-txt b { font-size: 13.5px; color: var(--ink); font-weight: 800; }
  .pa-lembrete-txt span { font-size: 12px; color: var(--ink-soft); }
  .pa-lembrete-x { margin-left: auto; background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 6px; display: flex; flex: none; border-radius: 8px; }
  .pa-lembrete-x:hover { background: rgba(0,0,0,0.05); }
  .pa-lembrete-x svg { width: 16px; height: 16px; }
  .pa-hist-head { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 8px; }
  .pa-hist-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 9px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
  .pa-hist-data { color: var(--ink-mute); font-weight: 600; }
  .pa-hist-sets { color: var(--moss-deep); font-weight: 600; }

  .pa-chart { margin-bottom: 12px; }
  .pa-spark { width: 100%; height: 60px; }
  .pa-spark polyline { fill: none; stroke: var(--moss); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pa-spark circle { fill: var(--gold); }
  .pa-trend { font-size: 11.5px; color: var(--ink-mute); text-align: center; margin-top: 4px; font-weight: 600; }
