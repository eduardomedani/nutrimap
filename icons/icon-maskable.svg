<!-- Evollo · ícone do app (purpose "maskable").
     Sem cantos próprios: o sistema operacional aplica a máscara dele, e canto
     transparente aqui apareceria recortado. O "E" cabe na zona segura (80%
     central), então nenhuma máscara corta o símbolo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Evollo">
  <rect width="512" height="512" fill="#18B984"/>
  <g fill="#FFFFFF" transform="translate(256,256) scale(0.8) translate(-256,-256)">
    <rect x="176" y="152" width="40"  height="208" rx="8"/>
    <rect x="176" y="152" width="160" height="40"  rx="8"/>
    <rect x="176" y="236" width="132" height="40"  rx="8"/>
    <rect x="176" y="320" width="160" height="40"  rx="8"/>
  </g>
</svg>
